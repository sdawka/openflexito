[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openflexito"
version = "0.1.0"
description = "Thin device service for an OpenFlexure microscope: camera stream, Sangaboard relay, status LED"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
pi = ["picamera2", "numpy", "pillow"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy", "pillow"]

[project.scripts]
openflexito = "openflexito.__main__:main"

[tool.setuptools.packages.find]
include = ["openflexito*"]

[tool.setuptools.package-data]
openflexito = ["tuning/*.json", "fallback/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
