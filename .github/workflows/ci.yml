name: ci
on:
  push:
    branches: [main]
    paths: ['device/**', 'webapp/**', '.github/workflows/**']
  pull_request:
    paths: ['device/**', 'webapp/**', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: device/pyproject.toml }
      - run: pip install -e "device[dev]"
      - run: pytest -q device
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm ci
        working-directory: webapp
      - run: npm run check
        working-directory: webapp
      - run: npm test -- --run
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
